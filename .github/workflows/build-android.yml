name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (platform-tools + build-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0"

      - name: Cache Godot editor + templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-cache
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Build APK
        run: bash tools/ci/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deadland-after-zero-apk
          path: build/deadland-after-zero-debug.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
